services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - nakama-postgres:/var/lib/postgresql/data

  nakama-api:
    build:
      context: .
      dockerfile: src/backend/Nakama.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: 8080
      ConnectionStrings__NakamaDatabase: ${ConnectionStrings__NakamaDatabase:?set ConnectionStrings__NakamaDatabase in .env}
      Authentication__Jwt__SigningKey: ${Authentication__Jwt__SigningKey:?set Authentication__Jwt__SigningKey in .env}
      Authentication__Jwt__Issuer: ${Authentication__Jwt__Issuer:?set Authentication__Jwt__Issuer in .env}
      Authentication__Jwt__Audience: ${Authentication__Jwt__Audience:?set Authentication__Jwt__Audience in .env}
      Authentication__Jwt__AccessTokenMinutes: ${Authentication__Jwt__AccessTokenMinutes:?set Authentication__Jwt__AccessTokenMinutes in .env}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:?set Cors__AllowedOrigins__0 in .env}
      AllowedHosts: ${AllowedHosts:?set AllowedHosts in .env}
      Attachments__StoragePath: /data/attachments
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - nakama-attachments:/data/attachments

  nakama-web:
    build:
      context: ./src/frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
    ports:
      - "8081:80"

volumes:
  nakama-postgres:
  nakama-attachments:
